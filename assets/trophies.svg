<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 196" width="100%">
  <defs>
    <linearGradient id="trophyBorderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="trophyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="trophyPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="trophySoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-font { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 900; }
    .mono-font { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Card Background -->
  <rect x="6" y="6" width="928" height="184" rx="16" fill="#060814" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Animated Neon Lighting Border -->
  <rect x="6" y="6" width="928" height="184" rx="16" fill="none" stroke="url(#trophyBorderNeon)" stroke-width="3" filter="url(#trophyGlow)" stroke-dasharray="220 300" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-1040" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Brackets -->
  <path d="M 18,32 L 18,18 L 32,18" stroke="#00f7ff" stroke-width="2.2" fill="none"/>
  <circle cx="18" cy="18" r="2.2" fill="#00f7ff"/>
  <path d="M 922,32 L 922,18 L 908,18" stroke="#a855f7" stroke-width="2.2" fill="none"/>
  <circle cx="922" cy="18" r="2.2" fill="#a855f7"/>
  <path d="M 18,164 L 18,178 L 32,178" stroke="#00ff88" stroke-width="2.2" fill="none"/>
  <circle cx="18" cy="178" r="2.2" fill="#00ff88"/>
  <path d="M 922,164 L 922,178 L 908,178" stroke="#fde047" stroke-width="2.2" fill="none"/>
  <circle cx="922" cy="178" r="2.2" fill="#fde047"/>

  <!-- Card Header -->
  <g transform="translate(470, 34)">
    <circle cx="-210" cy="-4" r="4" fill="#fde047" filter="url(#trophyGlow)"/>
    <text x="0" y="0" fill="#ffffff" class="title-font" font-size="16" letter-spacing="1.5" text-anchor="middle">
      🏆 GITHUB TROPHIES &amp; ACHIEVEMENTS
    </text>
    <circle cx="210" cy="-4" r="4" fill="#00ff88" filter="url(#trophyGlow)"/>
    <text x="0" y="16" fill="#94a3b8" class="mono-font" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">
      VERIFIED DEVELOPER RIG // ELITE REPOSITORY MERITS
    </text>
  </g>

  <!-- Render All 6 Trophies -->
  
    <!-- Trophy 1: REPO ARCHITECT -->
    <g transform="translate(34, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#fde047" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#fde047" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <polygon points="0,-16 14,-6 8,14 -8,14 -14,-6" fill="url(#trophyGoldGrad)" stroke="#fde047" stroke-width="1.2" filter="url(#trophySoftGlow)"/>
              <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#fde047" fill-opacity="0.15" stroke="#fde047" stroke-width="1"/>
      <text x="67" y="81" fill="#fde047" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK S+</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">REPO ARCHITECT</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">32+ REPOSITORIES</text>
    </g>
    <!-- Trophy 2: COMMIT TITAN -->
    <g transform="translate(178, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#00ff88" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <polygon points="3,-17 -7,0 1,0 -3,17 7,0 -1,0" fill="#00ff88" filter="url(#trophyGlow)"/>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
      <text x="67" y="81" fill="#00ff88" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK S+</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">COMMIT TITAN</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">2,840+ COMMITS</text>
    </g>
    <!-- Trophy 3: STREAK MASTER -->
    <g transform="translate(322, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#a855f7" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <circle cx="0" cy="0" r="15" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 3"/>
              <circle cx="0" cy="0" r="10" fill="#060814"/>
              <text x="0" y="6" font-size="15" text-anchor="middle">🔥</text>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
      <text x="67" y="81" fill="#a855f7" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK S</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">STREAK MASTER</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">142D RECORD</text>
    </g>
    <!-- Trophy 4: PR SPECIALIST -->
    <g transform="translate(466, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#00f7ff" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#00f7ff" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <circle cx="-6" cy="8" r="3.5" fill="#00f7ff" filter="url(#trophySoftGlow)"/>
              <circle cx="6" cy="-8" r="3.5" fill="#00f7ff" filter="url(#trophySoftGlow)"/>
              <path d="M -6,5 L -6,-2 Q -6,-8 0,-8 L 3,-8" fill="none" stroke="#00f7ff" stroke-width="2"/>
              <line x1="-6" y1="5" x2="-6" y2="14" stroke="#00f7ff" stroke-width="2"/>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#00f7ff" fill-opacity="0.15" stroke="#00f7ff" stroke-width="1"/>
      <text x="67" y="81" fill="#00f7ff" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK A+</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PR SPECIALIST</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">85+ MERGED PRS</text>
    </g>
    <!-- Trophy 5: DRAGON SLAYER -->
    <g transform="translate(610, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#ff0055" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#ff0055" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <path d="M 0,-16 C 9,-11 14,-2 9,7 C 4,16 -6,16 -11,9 C -16,2 -7,-9 0,-16 Z" fill="url(#trophyPinkGrad)" stroke="#ff0055" stroke-width="1.2" filter="url(#trophySoftGlow)"/>
              <circle cx="0" cy="0" r="3.5" fill="#fde047"/>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1"/>
      <text x="67" y="81" fill="#ff0055" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK MAX</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DRAGON SLAYER</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">120 FPS ENGINE</text>
    </g>
    <!-- Trophy 6: STAR PIONEER -->
    <g transform="translate(754, 62)">
      <!-- Outer Card Box -->
      <rect x="0" y="0" width="134" height="114" rx="12" fill="#0b1126" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="134" height="114" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Glowing Base Pedestal -->
      <ellipse cx="67" cy="46" rx="28" ry="6" fill="#f59e0b" opacity="0.2" filter="url(#trophySoftGlow)"/>

      <!-- Center Icon -->
      <g transform="translate(67, 40)">
        
              <polygon points="0,-16 4.5,-5 16,-5 7,2 11,14 0,7 -11,14 -7,2 -16,-5 -4.5,-5" fill="url(#trophyGoldGrad)" stroke="#fde047" stroke-width="1.2" filter="url(#trophySoftGlow)"/>
      </g>

      <!-- Grade Rank Badge -->
      <rect x="36" y="68" width="62" height="18" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <text x="67" y="81" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">RANK S</text>

      <!-- Title & Desc -->
      <text x="67" y="96" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">STAR PIONEER</text>
      <text x="67" y="107" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">120+ STARS</text>
    </g>
</svg>