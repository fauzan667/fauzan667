name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Realistic Neon Viper & Lighting Bar SVG
        run: |
          python3 - << 'EOF'
          import os, math

          os.makedirs("dist", exist_ok=True)

          # 1. Buat Garis Pembatas Neon Bercahaya (Lighting Divider)
          bar_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#060913" stop-opacity="0"/>
                <stop offset="20%" stop-color="#a855f7"/>
                <stop offset="50%" stop-color="#00f7ff"/>
                <stop offset="80%" stop-color="#00ff88"/>
                <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
                <feGaussianBlur stdDeviation="3.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <line x1="20" y1="12" x2="880" y2="12" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
            <circle cx="450" cy="12" r="4" fill="#ffffff" filter="url(#glow)">
              <animate attributeName="cx" values="120;780;120" dur="5s" repeatCount="indefinite"/>
            </circle>
          </svg>'''
          with open("dist/neon-bar.svg", "w") as f:
              f.write(bar_svg)

          # 2. Buat Kotak Game Ular Realistis (Neon Cyber Viper) dengan Lighting Border
          dots = []
          for col in range(42):
              for row in range(6):
                  cx = 42 + col * 19.4
                  cy = 98 + row * 22
                  lvl = (col * 7 + row * 13) % 10
                  if lvl == 0:
                      color, op = "#00ff88", "0.75"
                  elif lvl in (1, 2):
                      color, op = "#00f7ff", "0.55"
                  elif lvl in (3, 4):
                      color, op = "#a855f7", "0.45"
                  else:
                      color, op = "#1e293b", "0.65"
                  dots.append(f'<circle cx="{cx:.1f}" cy="{cy:.1f}" r="4.5" fill="{color}" fill-opacity="{op}"/>')

          # Segmen tubuh ular yang menyambung mulus dan meruncing ke ekor
          segments = []
          num_segments = 32
          for i in range(num_segments - 1, 0, -1):
              t = i / num_segments
              rx = 10.5 * (1 - t * 0.72)
              ry = 7.8 * (1 - t * 0.75)
              delay = -i * 0.065
              fill = "url(#viperScale1)" if i % 2 == 0 else "url(#viperScale2)"
              segments.append(f'''
              <g>
                <ellipse rx="{rx:.2f}" ry="{ry:.2f}" fill="{fill}" stroke="#042f2e" stroke-width="0.8" filter="url(#softGlow)"/>
                <ellipse rx="{rx*0.45:.2f}" ry="{ry*0.35:.2f}" fill="#d9f99d" fill-opacity="0.5"/>
                <animateMotion dur="11s" begin="{delay:.3f}s" repeatCount="indefinite" rotate="auto">
                  <mpath href="#viperPath"/>
                </animateMotion>
              </g>''')

          # Kepala Ular Realistis (Mata Menyala & Lidah Bercabang)
          head_svg = '''
          <g filter="url(#neonGlow)">
            <!-- Lidah Bercabang Berkedip -->
            <path d="M 12,0 L 23,0 L 28,-4 M 23,0 L 28,4" stroke="#ff0055" stroke-width="1.8" stroke-linecap="round" fill="none">
              <animate attributeName="opacity" values="1;0.1;1;1;0;0.8;1" dur="0.9s" repeatCount="indefinite"/>
            </path>
            <!-- Bentuk Kepala Viper -->
            <path d="M -11,-7.5 C -4,-11 6,-7 14,0 C 6,7 -4,11 -11,7.5 C -15,4 -15,-4 -11,-7.5 Z" fill="url(#viperHead)" stroke="#00ff88" stroke-width="1"/>
            <!-- Corak Mahkota Kepala -->
            <path d="M -8,-3 L 2,0 L -8,3 Z" fill="#064e3b" opacity="0.7"/>
            <!-- Mata Ular Menyala -->
            <ellipse cx="3.5" cy="-4.2" rx="2.4" ry="1.5" fill="#fde047"/>
            <ellipse cx="3.5" cy="4.2" rx="2.4" ry="1.5" fill="#fde047"/>
            <line x1="2.5" y1="-4.2" x2="4.5" y2="-4.2" stroke="#000" stroke-width="1"/>
            <line x1="2.5" y1="4.2" x2="4.5" y2="4.2" stroke="#000" stroke-width="1"/>
            <animateMotion dur="11s" begin="0s" repeatCount="indefinite" rotate="auto">
              <mpath href="#viperPath"/>
            </animateMotion>
          </g>'''

          snake_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%">
            <defs>
              <linearGradient id="borderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f7ff"/>
                <stop offset="50%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#00ff88"/>
              </linearGradient>
              <linearGradient id="viperHead" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00b4d8"/>
                <stop offset="100%" stop-color="#00ff88"/>
              </linearGradient>
              <radialGradient id="viperScale1" cx="40%" cy="40%" r="65%">
                <stop offset="0%" stop-color="#4ade80"/>
                <stop offset="65%" stop-color="#10b981"/>
                <stop offset="100%" stop-color="#064e3b"/>
              </radialGradient>
              <radialGradient id="viperScale2" cx="40%" cy="40%" r="65%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="65%" stop-color="#059669"/>
                <stop offset="100%" stop-color="#022c22"/>
              </radialGradient>
              <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Jalur Meliuk Ular -->
              <path id="viperPath" d="M 65,120 C 150,70 210,215 310,130 C 410,55 470,225 575,135 C 670,60 740,215 815,125 C 845,80 730,65 610,185 C 490,250 360,75 220,190 C 125,240 35,165 65,120 Z"/>
            </defs>

            <!-- Background Card Gelap -->
            <rect x="6" y="6" width="868" height="298" rx="18" fill="#070a14" stroke="#1e293b" stroke-width="2"/>

            <!-- Efek Lighting Berjalan di Sekeliling Kotak -->
            <rect x="6" y="6" width="868" height="298" rx="18" fill="none" stroke="url(#borderNeon)" stroke-width="3.5" filter="url(#neonGlow)" stroke-dasharray="260 320">
              <animate attributeName="stroke-dashoffset" from="0" to="-1160" dur="5s" repeatCount="indefinite"/>
            </rect>

            <!-- Header Card -->
            <circle cx="34" cy="36" r="6" fill="#00ff88" filter="url(#neonGlow)"/>
            <text x="50" y="41" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold">NEON VIPER • CONTRIBUTION HARVESTER</text>
            <text x="50" y="58" fill="#94a3b8" font-family="monospace" font-size="11">@fauzan667 | REAL-TIME SLITHERING ENGINE | CYBER MATRIX</text>
            <text x="842" y="40" fill="#00f7ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">LIVE ENGINE</text>
            <text x="842" y="58" fill="#00ff88" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">⚡ ACTIVE</text>

            <!-- Grid Kontribusi -->
            {"".join(dots)}

            <!-- Makanan / Energy Orbs Bercahaya -->
            <circle cx="310" cy="130" r="6" fill="#ff0055" filter="url(#neonGlow)">
              <animate attributeName="r" values="4;7;4" dur="1.2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="575" cy="135" r="6" fill="#fde047" filter="url(#neonGlow)">
              <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="815" cy="125" r="6" fill="#00f7ff" filter="url(#neonGlow)">
              <animate attributeName="r" values="4;7;4" dur="1.1s" repeatCount="indefinite"/>
            </circle>

            <!-- Tubuh & Kepala Ular -->
            {"".join(segments)}
            {head_svg}

            <!-- Energy Meter Bar Bawah -->
            <text x="38" y="258" fill="#00f7ff" font-family="monospace" font-size="10" font-weight="bold">CONTRIBUTION ENERGY METER (REAL-TIME HARVESTER)</text>
            <text x="842" y="258" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">■■■■ XP TIERS MAX</text>
            <rect x="38" y="268" width="804" height="10" rx="5" fill="#1e293b"/>
            <rect x="38" y="268" width="620" height="10" rx="5" fill="url(#borderNeon)" filter="url(#softGlow)">
              <animate attributeName="width" values="180;760;180" dur="8s" repeatCount="indefinite"/>
            </rect>
          </svg>'''

          with open("dist/github-contribution-grid-snake.svg", "w") as f:
              f.write(snake_svg)
          EOF

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
