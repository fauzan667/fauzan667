      <text x="680" y="456" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">FRI</text>
      <circle cx="765" cy="320" r="4.5" fill="#00f7ff" filter="url(#metricGlow)"/>
      <circle cx="765" cy="320" r="2" fill="#ffffff"/>
